workflows:
  android-debug:
    name: AXIS Android Debug APK
    max_build_duration: 60
    
    # Usamos la máquina estándar de Linux que es más rápida para Android
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          # 1. Le damos permiso de ejecución al Gradle Wrapper (crítico)
          chmod +x gradlew
          
          # 2. Compilamos el APK de prueba
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
