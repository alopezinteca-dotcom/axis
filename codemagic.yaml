workflows:
  android-debug:
    name: AXIS Android Debug APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          # 1. Damos permiso de ejecución a Gradle
          chmod +x gradlew
          
          # 2. Compilamos el APK normalmente (ya no hay Spotless que nos moleste)
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
