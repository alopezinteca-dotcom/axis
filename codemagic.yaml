workflows:
  android-debug:
    name: AXIS Android Debug APK
    max_build_duration: 60

    # Hemos eliminado la línea instance_type para usar la máquina gratuita por defecto

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
