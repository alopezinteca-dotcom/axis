codemagic.yaml
(Recuerda: Este archivo debe ir exactamente en la carpeta raíz de tu proyecto, al mismo nivel que la carpeta app y el archivo build.gradle.kts principal).

YAML
workflows:
  android-debug:
    name: AXIS Android Debug APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build debug APK
        script: |
          # 1. Damos permiso de ejecución a Gradle (Evita error "Permission denied")
          chmod +x gradlew
          
          # 2. Compilamos el APK ignorando las reglas estrictas de formato (-x)
          ./gradlew assembleDebug -x spotlessKotlinApply -x spotlessKotlin -x spotlessCheck

    artifacts:
      - app/build/outputs/**/*.apk
